<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Final Harvest — Halloween Edition</title>
<style>
  :root {
    --bg: #0d0a14;
    --card: #1a1424;
    --card2: #221a33;
    --accent: #ff6a00;
    --accent2: #b026ff;
    --text: #f2e9ff;
    --muted: #9b8fb3;
    --green: #6bff9b;
    --red: #ff6b6b;
    --yellow: #ffc96b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at top, #1a0f2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 32px; }
  h1 {
    font-size: clamp(28px, 6vw, 52px);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .sub { color: var(--muted); margin-top: 10px; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }

  .card {
    background: var(--card);
    border: 1px solid #2c2140;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .card h2 {
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .status-badge {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }
  .status-active { background: #1e4d2b; color: var(--green); }
  .status-soon   { background: #4d3a1e; color: var(--yellow); }
  .status-done   { background: #4d1e1e; color: var(--red); }
  .status-text { color: var(--muted); margin-top: 12px; font-size: 15px; }

  .stages { display: grid; gap: 12px; }
  .stage {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 12px;
    background: var(--card2); border-left: 4px solid #3a2d55;
    transition: all .3s;
  }
  .stage.done    { border-left-color: var(--green); }
  .stage.current { border-left-color: var(--accent); background: #2a1f3d; box-shadow: 0 0 20px rgba(255,106,0,.15); }
  .stage .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #3a2d55; flex-shrink: 0;
  }
  .stage.done .dot    { background: var(--green); }
  .stage.current .dot { background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .stage b { display: block; margin-bottom: 2px; }
  .stage small { color: var(--muted); font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: var(--card2); border-radius: 12px; padding: 20px; text-align: center; }
  .stat .num { font-size: 36px; font-weight: 800; color: var(--accent); line-height: 1; }
  .stat .label { color: var(--muted); font-size: 13px; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }

  .join-form { display: flex; flex-direction: column; gap: 12px; }
  input, select {
    background: #150f22; border: 1px solid #3a2d55; color: var(--text);
    padding: 14px 16px; border-radius: 10px; font-size: 16px;
    font-family: inherit; transition: border-color .2s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input::placeholder { color: #5a4d70; }
  button {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; border: none; padding: 16px; border-radius: 10px;
    font-size: 17px; font-weight: 800; cursor: pointer;
    letter-spacing: 1px; transition: transform .1s, opacity .2s;
    font-family: inherit;
  }
  button:hover:not(:disabled) { transform: scale(1.02); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-size: 15px; min-height: 20px; }
  .msg.ok  { color: var(--green); }
  .msg.err { color: var(--red); }

  .participants { display: grid; gap: 8px; }
  .p-item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card2); padding: 12px 16px; border-radius: 10px;
    font-size: 15px;
  }
  .p-item .role {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: #3a2d55; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px;
  }
  .p-item .role.survivor { background: #1e4d2b; color: var(--green); }
  .p-item .role.hunter   { background: #4d1e1e; color: var(--red); }
  .p-item .role.witch    { background: #4d1e4d; color: #d96bff; }
  .empty { color: var(--muted); text-align: center; padding: 20px; font-style: italic; }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🎃 THE FINAL HARVEST</h1>
    <p class="sub">Halloween Edition · Clan Evade</p>
  </header>

  <div class="card">
    <h2>Статус ивента</h2>
    <span id="statusBadge" class="status-badge status-soon">Загрузка...</span>
    <p class="status-text" id="statusText"></p>
  </div>

  <div class="card">
    <h2>Этапы</h2>
    <div class="stages" id="stages"></div>
  </div>

  <div class="card">
    <h2>Статистика</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="label">Участников</div></div>
      <div class="stat"><div class="num" id="statToday">0</div><div class="label">Сегодня</div></div>
      <div class="stat"><div class="num" id="statSurv">0</div><div class="label">Выживших</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Участвовать</h2>
    <form class="join-form" id="joinForm">
      <input type="text" id="nick" placeholder="Твой ник в Evade" required maxlength="32" autocomplete="off">
      <input type="text" id="tg" placeholder="@username в Telegram" required maxlength="32" autocomplete="off">
      <select id="role">
        <option value="survivor">🎯 Выживший</option>
        <option value="hunter">🔪 Охотник</option>
        <option value="witch">🧙 Ведьма</option>
      </select>
      <button type="submit" id="submitBtn">🔥 ПРИНЯТЬ УЧАСТИЕ</button>
      <div class="msg" id="formMsg"></div>
    </form>
  </div>

  <div class="card">
    <h2>Участники</h2>
    <div class="participants" id="participants">
      <div class="empty">Пока никого нет. Будь первым!</div>
    </div>
  </div>

  <footer>The Final Harvest · Halloween 2026</footer>

</div>

<script>
// ====== НАСТРОЙКИ ======
const EVENT_STATUS = "active"; // "active" | "soon" | "done"
const STORAGE_KEY  = "final_harvest_participants";

// ====== ДАННЫЕ ======
function loadParticipants() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { return []; }
}
function saveParticipants(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

// ====== СТАТУС ======
function getStatus() {
  const map = {
    active: { label: "🟢 Ивент идёт",    cls: "status-active", text: "Регистрация открыта, врывайся!" },
    soon:   { label: "🟡 Скоро старт",   cls: "status-soon",   text: "Регистрация откроется совсем скоро." },
    done:   { label: "🔴 Ивент завершён", cls: "status-done",  text: "Спасибо всем, кто участвовал!" }
  };
  return map[EVENT_STATUS] || map.soon;
}

function getStages() {
  const order = ["soon", "active", "done"];
  const currentIdx = order.indexOf(EVENT_STATUS);
  const stages = [
    { name: "Регистрация",    desc: "Приём заявок на сайте",     idx: 0 },
    { name: "Отбор",          desc: "Формирование команд",       idx: 1 },
    { name: "Финальная ночь", desc: "Турнир в Evade",            idx: 2 }
  ];
  return stages.map(s => {
    let state = "pending";
    if (s.idx < currentIdx) state = "done";
    else if (s.idx === currentIdx) state = "current";
    return { ...s, state };
  });
}

function renderStatus() {
  const s = getStatus();
  const badge = document.getElementById("statusBadge");
  badge.textContent = s.label;
  badge.className = "status-badge " + s.cls;
  document.getElementById("statusText").textContent = s.text;
}

function renderStages() {
  const wrap = document.getElementById("stages");
  wrap.innerHTML = "";
  getStages().forEach(s => {
    const el = document.createElement("div");
    el.className = "stage " + s.state;
    el.innerHTML = `<div class="dot"></div><div><b>${s.name}</b><small>${s.desc}</small></div>`;
    wrap.appendChild(el);
  });
}

// ====== СТАТИСТИКА ======
function renderStats() {
  const list = loadParticipants();
  const dayStart = new Date().setHours(0,0,0,0);
  document.getElementById("statTotal").textContent = list.length;
  document.getElementById("statToday").textContent = list.filter(p => p.at >= dayStart).length;
  document.getElementById("statSurv").textContent  = list.filter(p => p.role === "survivor").length;
}

// ====== СПИСОК УЧАСТНИКОВ ======
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderParticipants() {
  const wrap = document.getElementById("participants");
  const list = loadParticipants().slice().reverse();
  if (!list.length) {
    wrap.innerHTML = '<div class="empty">Пока никого нет. Будь первым!</div>';
    return;
  }
  const roleNames = { survivor: "Выживший", hunter: "Охотник", witch: "Ведьма" };
  wrap.innerHTML = list.map(p => `
    <div class="p-item">
      <div><b>${escapeHtml(p.nick)}</b> <span style="color:var(--muted)">${escapeHtml(p.tg)}</span></div>
      <span class="role ${p.role}">${roleNames[p.role] || p.role}</span>
    </div>
  `).join("");
}

// ====== ФОРМА ======
document.getElementById("joinForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("formMsg");
  const nick = document.getElementById("nick").value.trim();
  const tg   = document.getElementById("tg").value.trim();
  const role = document.getElementById("role").value;

  msg.textContent = "";
  msg.className = "msg";

  if (!nick || !tg) {
    msg.className = "msg err";
    msg.textContent = "❌ Заполни ник и Telegram";
    return;
  }

  const list = loadParticipants();
  if (list.some(p => p.tg.toLowerCase() === tg.toLowerCase())) {
    msg.className = "msg err";
    msg.textContent = "❌ Этот Telegram уже участвует";
    return;
  }

  list.push({ nick, tg, role, at: Date.now() });
  saveParticipants(list);

  msg.className = "msg ok";
  msg.textContent = "✅ Ты зарегистрирован!";

  // визуальный отклик кнопки
  btn.disabled = true;
  btn.textContent = "ЗАГРУЖЕНО ✓";
  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = "🔥 ПРИНЯТЬ УЧАСТИЕ";
  }, 1200);

  document.getElementById("joinForm").reset();
  renderStats();
  renderParticipants();
});

// ====== ИНИЦИАЛИЗАЦИЯ ======
renderStatus();
renderStages();
renderStats();
renderParticipants();

// обновление раз в 30 сек (на случай если открыто в нескольких вкладках)
setInterval(() => {
  renderStats();
  renderParticipants();
}, 30000);
</script>
</body>
</html>
